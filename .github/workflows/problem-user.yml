name: Тесты под problem_user

# Запускается вручную: вкладка Actions → «Тесты под problem_user» → Run workflow.
# Ожидается, что часть тестов упадёт: у problem_user на сайте заложены баги.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:problem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-problem-user
          path: playwright-report/
          retention-days: 14
